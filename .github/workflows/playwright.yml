name: 🎭 Playwright Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            browser: chromium
            artifact: chromium
          - project: firefox
            browser: firefox
            artifact: firefox
          - project: webkit
            browser: webkit
            artifact: webkit
          - project: "Mobile Chrome"
            browser: chromium
            artifact: mobile-chrome
          - project: "Mobile Safari"
            browser: webkit
            artifact: mobile-safari

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: 🐣 Setup mise
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10
        with:
          install_args: bun

      - name: 📦 Install dependencies
        run: bun i

      # Written after `mise-action` ran, so it wins over the development secret
      # in `mise.toml`'s `[env]`, which the action exports into this job.
      - name: 🔑 Generate Better Auth Secret
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      # Bring up Postgres + RustFS via the same docker-compose.yml used for
      # local development, so CI matches developer environments exactly.
      # `--wait` blocks until the postgres healthcheck passes.
      - name: 🐳 Start Postgres + RustFS
        run: docker compose up -d --wait

      # `local:provision` is what the `db` daemon runs as its readiness check:
      # the schema, then the bucket. The seed stays a direct script call, because
      # `mise run db:seed` requires the `db` daemon and would bring the stack up
      # a second time under pitchfork, which CI does not run.
      - name: 🪣 Apply schema, ensure bucket, and seed
        run: |
          mise run local:provision
          bun mise-tasks/db/seed.ts

      # `playwright.config.ts` runs `bun start` on CI, so build the app first.
      - name: 🧩 Build app
        run: bun run build

      - name: 🎭 Install Playwright Browsers
        run: bun playwright install --with-deps ${{ matrix.browser }}

      - name: 🧪 Run Playwright tests
        run: bun --bun playwright test --project="${{ matrix.project }}"

      - name: 🆙 Upload Test Report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.artifact }}
          path: playwright-report/
          retention-days: 30

      - name: 🛑 Stop containers
        if: always()
        run: docker compose down -v
